<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="trophyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldTrophy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <linearGradient id="pedestal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="shadowTrophy" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="3.5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <circle cx="50" cy="50" r="46" fill="url(#trophyGlow)"/>

  <g filter="url(#shadowTrophy)">
    <!-- Laurel Wreath Background -->
    <path d="M22 45 Q26 30 38 22 M20 58 Q24 72 38 78" stroke="#fde047" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.65"/>
    <path d="M78 45 Q74 30 62 22 M80 58 Q76 72 62 78" stroke="#fde047" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.65"/>

    <!-- Trophy Left Handle -->
    <path d="M30 28 C20 28 20 50 34 52" stroke="url(#goldTrophy)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <!-- Trophy Right Handle -->
    <path d="M70 28 C80 28 80 50 66 52" stroke="url(#goldTrophy)" stroke-width="4.5" fill="none" stroke-linecap="round"/>

    <!-- Trophy Main Cup Body -->
    <path d="M30 22 H70 V40 C70 54 58 60 50 62 C42 60 30 54 30 40 Z" fill="url(#goldTrophy)"/>
    <path d="M32 24 H37 V40 C37 50 42 56 46 58 V24 Z" fill="#ffffff" opacity="0.3"/>

    <!-- Cup Rim Top -->
    <ellipse cx="50" cy="22" rx="20" ry="3" fill="#fef08a"/>

    <!-- Center Star Emblem -->
    <polygon points="50,33 52.5,38 58,38.5 54,42 55.5,47.5 50,44.5 44.5,47.5 46,42 42,38.5 47.5,38" fill="#ffffff"/>

    <!-- Stem -->
    <rect x="46" y="62" width="8" height="12" fill="url(#goldTrophy)"/>

    <!-- Pedestal Base -->
    <rect x="36" y="74" width="28" height="6" rx="1.5" fill="url(#goldTrophy)"/>
    <rect x="30" y="80" width="40" height="10" rx="3" fill="url(#pedestal)"/>
    <rect x="38" y="83" width="24" height="4" rx="1" fill="#fde047" opacity="0.8"/>
  </g>
</svg>

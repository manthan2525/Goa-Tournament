<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="kabaddiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#be123c" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <filter id="shadowKabaddi" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="3.5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <circle cx="50" cy="50" r="46" fill="url(#kabaddiGlow)"/>

  <g filter="url(#shadowKabaddi)">
    <!-- Competition Shield Emblem -->
    <path d="M50 14 L80 25 V52 C80 70 50 86 50 86 C50 86 20 70 20 52 V25 Z" fill="url(#shieldGrad)"/>
    <path d="M50 18 L76 28 V50 C76 66 50 80 50 80 C50 80 24 66 24 50 V28 Z" stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.35"/>

    <!-- Flame Power Trails inside Shield -->
    <path d="M50 30 Q38 45 42 62 Q50 48 50 30" fill="url(#flameGrad)"/>
    <path d="M50 30 Q62 45 58 62 Q50 48 50 30" fill="url(#flameGrad)"/>
    <path d="M50 24 Q44 38 47 52 Q50 40 50 24" fill="#fef08a"/>

    <!-- Raider Hand/Clenched Fist Vector Icon -->
    <g transform="translate(34, 38)">
      <!-- Arm Muscle / Hand Thrust -->
      <path d="M4 22 L14 10 C18 6 26 8 28 14 L24 26 C22 30 12 32 4 22 Z" fill="#ffffff" opacity="0.95"/>
      <circle cx="24" cy="12" r="3" fill="#f59e0b"/>
    </g>

    <!-- Star Accent at Top -->
    <polygon points="50,18 52,22 56,22 53,25 54,29 50,26 46,29 47,25 44,22 48,22" fill="#fde047"/>
  </g>
</svg>

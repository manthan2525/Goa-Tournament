<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="cricketGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Wood Bat Gradient -->
    <linearGradient id="batWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Bat Grip Gradient -->
    <linearGradient id="batGrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Red Ball Gradient -->
    <radialGradient id="redBall" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="85%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>

    <!-- Gold Stumps Gradient -->
    <linearGradient id="goldStump" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="50" cy="50" r="45" fill="url(#cricketGlow)"/>

  <g filter="url(#dropShadow)">
    <!-- Wickets / Stumps in Background -->
    <!-- Stump 1 -->
    <rect x="42" y="32" width="3" height="34" rx="1.5" fill="url(#goldStump)"/>
    <!-- Stump 2 -->
    <rect x="48.5" y="32" width="3" height="34" rx="1.5" fill="url(#goldStump)"/>
    <!-- Stump 3 -->
    <rect x="55" y="32" width="3" height="34" rx="1.5" fill="url(#goldStump)"/>
    <!-- Bails -->
    <rect x="41" y="29.5" width="8" height="2.5" rx="1" fill="#fde047"/>
    <rect x="51" y="29.5" width="8" height="2.5" rx="1" fill="#fde047"/>

    <!-- Crossed Bat 1 (Left to Right) -->
    <g transform="rotate(-38 50 50)">
      <!-- Blade -->
      <path d="M47 30 L53 30 L52 76 C52 79 48 79 48 76 Z" fill="url(#batWood)"/>
      <path d="M47.5 30 L49 30 L49 76 L47.5 75 Z" fill="#ffffff" opacity="0.25"/>
      <!-- Handle -->
      <rect x="48" y="10" width="4" height="20" rx="1.5" fill="url(#batGrip)"/>
      <rect x="47" y="28" width="6" height="3" rx="1" fill="#e2e8f0"/>
    </g>

    <!-- Crossed Bat 2 (Right to Left) -->
    <g transform="rotate(38 50 50)">
      <!-- Blade -->
      <path d="M47 30 L53 30 L52 76 C52 79 48 79 48 76 Z" fill="url(#batWood)"/>
      <path d="M47.5 30 L49 30 L49 76 L47.5 75 Z" fill="#ffffff" opacity="0.25"/>
      <!-- Handle -->
      <rect x="48" y="10" width="4" height="20" rx="1.5" fill="url(#batGrip)"/>
      <rect x="47" y="28" width="6" height="3" rx="1" fill="#e2e8f0"/>
    </g>

    <!-- Front Leather Cricket Ball -->
    <circle cx="50" cy="65" r="14" fill="url(#redBall)"/>
    <!-- White Seam Stitching -->
    <path d="M41 57 Q50 65 41 73" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="1.5 1.5" fill="none" opacity="0.9"/>
    <path d="M59 57 Q50 65 59 73" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="1.5 1.5" fill="none" opacity="0.9"/>
    <path d="M41 57 Q50 65 41 73" stroke="#ffffff" stroke-width="0.8" fill="none" opacity="0.5"/>
    <path d="M59 57 Q50 65 59 73" stroke="#ffffff" stroke-width="0.8" fill="none" opacity="0.5"/>

    <!-- Ball Gloss Highlight -->
    <circle cx="45" cy="59" r="3.5" fill="#ffffff" opacity="0.45"/>
  </g>
</svg>

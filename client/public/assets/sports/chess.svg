<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="chessGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#475569" stop-opacity="0"/>
    </radialGradient>

    <!-- Dark Obsidian Piece -->
    <linearGradient id="obsidianGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Gold King Piece -->
    <linearGradient id="goldKing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <filter id="shadowChess" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="3.5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <circle cx="50" cy="50" r="46" fill="url(#chessGlow)"/>

  <!-- Chessboard Floor Grid Pedestal -->
  <g opacity="0.25">
    <rect x="20" y="74" width="60" height="12" rx="2" fill="#334155"/>
    <rect x="20" y="74" width="15" height="6" fill="#f8fafc"/>
    <rect x="35" y="74" width="15" height="6" fill="#0f172a"/>
    <rect x="50" y="74" width="15" height="6" fill="#f8fafc"/>
    <rect x="65" y="74" width="15" height="6" fill="#0f172a"/>

    <rect x="20" y="80" width="15" height="6" fill="#0f172a"/>
    <rect x="35" y="80" width="15" height="6" fill="#f8fafc"/>
    <rect x="50" y="80" width="15" height="6" fill="#0f172a"/>
    <rect x="65" y="80" width="15" height="6" fill="#f8fafc"/>
  </g>

  <g filter="url(#shadowChess)">
    <!-- Gold King (Right / Back) -->
    <g transform="translate(10, 0)">
      <!-- Cross Crown -->
      <path d="M48 20 H52 V22 H54 V24 H52 V27 H48 V24 H46 V22 H48 Z" fill="#fef08a"/>
      <!-- Head/Crown Base -->
      <path d="M42 27 Q50 23 58 27 L56 37 H44 Z" fill="url(#goldKing)"/>
      <!-- Body Pillar -->
      <path d="M45 37 Q50 39 55 37 L57 65 Q50 67 43 65 Z" fill="url(#goldKing)"/>
      <!-- Base -->
      <rect x="40" y="65" width="20" height="7" rx="2" fill="url(#goldKing)"/>
    </g>

    <!-- Obsidian Knight (Left / Front) -->
    <g>
      <!-- Knight Horse Profile -->
      <path d="M26 68 V63 C26 58 30 52 32 48 C30 46 26 44 24 40 C22 36 24 30 28 26 C34 22 42 24 46 28 C50 32 48 38 46 44 C44 50 48 56 46 63 V68 Z" fill="url(#obsidianGrad)"/>
      <!-- Mane Detail -->
      <path d="M34 25 Q42 30 42 38" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
      <!-- Eye -->
      <circle cx="33" cy="31" r="1.8" fill="#fef08a"/>
      <!-- Base -->
      <rect x="22" y="68" width="26" height="7" rx="2" fill="url(#obsidianGrad)"/>
    </g>
  </g>
</svg>

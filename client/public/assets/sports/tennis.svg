<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="tennisGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#84cc16" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#65a30d" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="tennisBallGrad" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="45%" stop-color="#a3e635"/>
      <stop offset="80%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </radialGradient>

    <linearGradient id="tennisRacketFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="50%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>

    <filter id="shadowTennis" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="3.5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <circle cx="50" cy="50" r="46" fill="url(#tennisGlow)"/>

  <g filter="url(#shadowTennis)">
    <!-- Tennis Racket Background -->
    <g transform="rotate(-35 50 50)">
      <ellipse cx="50" cy="35" rx="20" ry="24" stroke="url(#tennisRacketFrame)" stroke-width="3.5" fill="none"/>
      <!-- Mesh Strings -->
      <g stroke="#d9f99d" stroke-width="0.7" opacity="0.6">
        <line x1="38" y1="18" x2="38" y2="52"/>
        <line x1="44" y1="13" x2="44" y2="57"/>
        <line x1="50" y1="11" x2="50" y2="59"/>
        <line x1="56" y1="13" x2="56" y2="57"/>
        <line x1="62" y1="18" x2="62" y2="52"/>

        <line x1="32" y1="23" x2="68" y2="23"/>
        <line x1="30" y1="31" x2="70" y2="31"/>
        <line x1="30" y1="39" x2="70" y2="39"/>
        <line x1="32" y1="47" x2="68" y2="47"/>
      </g>
      <!-- Shaft & Handle -->
      <line x1="50" y1="59" x2="50" y2="82" stroke="url(#tennisRacketFrame)" stroke-width="3"/>
      <rect x="47.5" y="82" width="5" height="15" rx="1.5" fill="#0f172a"/>
    </g>

    <!-- Neon Yellow/Green Ball in Foreground -->
    <circle cx="62" cy="60" r="20" fill="url(#tennisBallGrad)"/>
    <!-- Curved White Seams -->
    <path d="M47 52 C55 60 55 68 47 76" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.9"/>
    <path d="M77 52 C69 60 69 68 77 76" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.9"/>

    <!-- Specular Highlight -->
    <circle cx="56" cy="52" r="3" fill="#ffffff" opacity="0.5"/>
  </g>
</svg>

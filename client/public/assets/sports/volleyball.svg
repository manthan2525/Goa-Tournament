<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="vbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vbBase" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>

    <filter id="shadowVB" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="3.5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <circle cx="50" cy="50" r="46" fill="url(#vbGlow)"/>

  <g filter="url(#shadowVB)">
    <circle cx="50" cy="48" r="32" fill="url(#vbBase)"/>

    <!-- Tricolor Swirl Panels (Blue & Yellow) -->
    <!-- Blue Panel Group 1 -->
    <path d="M50 16 C38 28 38 40 50 48 C62 40 62 28 50 16 Z" fill="#2563eb" opacity="0.85"/>
    <!-- Yellow Panel Group 2 -->
    <path d="M50 48 C38 56 38 68 50 80 C62 68 62 56 50 48 Z" fill="#eab308" opacity="0.9"/>

    <!-- Left Panel Swirl -->
    <path d="M18 48 C30 36 42 36 50 48 C42 60 30 60 18 48 Z" fill="#2563eb" opacity="0.85"/>

    <!-- Right Panel Swirl -->
    <path d="M82 48 C70 36 58 36 50 48 C58 60 70 60 82 48 Z" fill="#eab308" opacity="0.9"/>

    <!-- Seam Lines -->
    <circle cx="50" cy="48" r="32" stroke="#475569" stroke-width="1.8" fill="none"/>
    <path d="M50 16 Q35 32 50 48 Q65 32 50 16" stroke="#1e293b" stroke-width="1.5" fill="none"/>
    <path d="M50 48 Q35 64 50 80 Q65 64 50 48" stroke="#1e293b" stroke-width="1.5" fill="none"/>
    <path d="M18 48 Q34 33 50 48 Q34 63 18 48" stroke="#1e293b" stroke-width="1.5" fill="none"/>
    <path d="M82 48 Q66 33 50 48 Q66 63 82 48" stroke="#1e293b" stroke-width="1.5" fill="none"/>

    <!-- Gloss Specular Highlight -->
    <ellipse cx="40" cy="30" rx="8" ry="4" transform="rotate(-25 40 30)" fill="#ffffff" opacity="0.45"/>
  </g>
</svg>

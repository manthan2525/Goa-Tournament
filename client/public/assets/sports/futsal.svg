<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="futsalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="futsalBallBase" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="85%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </radialGradient>

    <linearGradient id="futsalAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>

    <filter id="shadowFutsal" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="3.5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <circle cx="50" cy="50" r="46" fill="url(#futsalGlow)"/>

  <!-- Indoor Wood Floor Lines Arc -->
  <path d="M15 72 Q50 90 85 72" stroke="#2dd4bf" stroke-width="2.5" fill="none" opacity="0.6"/>
  <path d="M22 78 Q50 94 78 78" stroke="#0d9488" stroke-width="1.8" fill="none" opacity="0.4"/>

  <g filter="url(#shadowFutsal)">
    <circle cx="50" cy="46" r="30" fill="url(#futsalBallBase)"/>

    <!-- Dynamic Futsal Polygon Pattern (Cyan/Teal Panels) -->
    <polygon points="50,34 58,40 55,50 45,50 42,40" fill="url(#futsalAccent)"/>
    <polygon points="34,22 42,18 47,26 41,33 32,30" fill="url(#futsalAccent)"/>
    <polygon points="66,22 68,30 59,33 53,26 58,18" fill="url(#futsalAccent)"/>
    <polygon points="50,64 56,60 54,72 46,72 44,60" fill="url(#futsalAccent)"/>

    <!-- Seams -->
    <circle cx="50" cy="46" r="30" stroke="#334155" stroke-width="1.5" fill="none"/>
    <line x1="42" y1="40" x2="41" y2="33" stroke="#334155" stroke-width="1.2"/>
    <line x1="58" y1="40" x2="59" y2="33" stroke="#334155" stroke-width="1.2"/>
    <line x1="55" y1="50" x2="56" y2="60" stroke="#334155" stroke-width="1.2"/>
    <line x1="45" y1="50" x2="44" y2="60" stroke="#334155" stroke-width="1.2"/>

    <!-- Highlight -->
    <ellipse cx="40" cy="28" rx="8" ry="4" transform="rotate(-25 40 28)" fill="#ffffff" opacity="0.45"/>
  </g>
</svg>
